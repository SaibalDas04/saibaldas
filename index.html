<!-- ====================================================================
         MASTER JAVASCRIPT ENGINE (Fetches Data from portfolio-data.json)
         ==================================================================== -->
    <script>
      // Global Dataset State (Populated dynamically from portfolio-data.json)
      let meshNodeData = [];
      let abapCookbookData = [];
      let cflLifecycleData = {};
      let codingBlockSteps = [];
      let cleanCoreData = [];

      let currentMeshNode = 0;
      let currentSnippet = null;
      let currentMode = "modern";
      let currentRunbookStep = 0;
      let currentMatrixIdx = 0;

      // 1. Interactive Mouse-Reactive Constellation Canvas
      const canvas = document.getElementById("ambientCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let width, height;
      const mouse = { x: null, y: null, radius: 130 };

      function resizeCanvas() {
        const parent = canvas.parentElement;
        if (!parent) return;
        width = canvas.width = parent.clientWidth;
        height = canvas.height = parent.clientHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const landingStage = document.getElementById("landing");
      if (landingStage) {
        landingStage.addEventListener("mousemove", (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        });
        landingStage.addEventListener("mouseleave", () => {
          mouse.x = null;
          mouse.y = null;
        });
      }

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 2 + 1;
          this.speedX = (Math.random() - 0.5) * 0.45;
          this.speedY = (Math.random() - 0.5) * 0.45;
          this.alpha = Math.random() * 0.5 + 0.25;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x > width) this.x = 0;
          if (this.x < 0) this.x = width;
          if (this.y > height) this.y = 0;
          if (this.y < 0) this.y = height;
        }
        draw() {
          ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < 38; i++) {
        particles.push(new Particle());
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 115) {
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 115)})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
          if (mouse.x !== null && mouse.y !== null) {
            const mDx = particles[i].x - mouse.x;
            const mDy = particles[i].y - mouse.y;
            const mDist = Math.sqrt(mDx * mDx + mDy * mDy);
            if (mDist < mouse.radius) {
              ctx.strokeStyle = `rgba(52, 211, 153, ${0.28 * (1 - mDist / mouse.radius)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }
        }
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // 2. Top Scroll Progress Bar
      window.addEventListener("scroll", () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        const bar = document.getElementById("scrollProgressBar");
        if (bar) bar.style.width = scrolled + "%";
      });

      // 3. Theme Toggle (Dark Evening Horizon vs Light Morning Horizon)
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");

      function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute("data-theme") || "dark";
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        if (themeIcon) themeIcon.innerText = next === "dark" ? "☀️" : "🌙";
      }
      if (themeToggleBtn) themeToggleBtn.addEventListener("click", toggleTheme);

      // 4. Desktop & Mobile Sidebar Controls
      const siteWrapper = document.getElementById("siteWrapper");
      const desktopSidebarToggle = document.getElementById("desktopSidebarToggle");
      const desktopCollapseBtn = document.getElementById("desktopCollapseBtn");
      const desktopToggleText = document.getElementById("desktopToggleText");
      const menuToggle = document.getElementById("menuToggle");
      const sidebarCol = document.getElementById("sidebarCol");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");
      const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");

      function toggleDesktopSidebar() {
        if (window.innerWidth <= 1024) {
          openProfileDrawer();
          return;
        }
        if (!siteWrapper) return;
        const isCollapsed = siteWrapper.classList.toggle("desktop-collapsed");
        if (desktopToggleText) {
          desktopToggleText.innerText = isCollapsed ? "Profile" : "Hide Profile";
        }
        if (desktopSidebarToggle) {
          desktopSidebarToggle.classList.toggle("active", !isCollapsed);
        }
        setTimeout(resizeCanvas, 460);
      }

      if (desktopSidebarToggle) desktopSidebarToggle.addEventListener("click", toggleDesktopSidebar);
      if (desktopCollapseBtn) desktopCollapseBtn.addEventListener("click", toggleDesktopSidebar);

      function openProfileDrawer() {
        if (!sidebarCol) return;
        sidebarCol.classList.add("drawer-open");
        sidebarBackdrop.classList.add("active");
        menuToggle.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeProfileDrawer() {
        if (!sidebarCol) return;
        sidebarCol.classList.remove("drawer-open");
        sidebarBackdrop.classList.remove("active");
        menuToggle.classList.remove("active");
        document.body.style.overflow = "";
      }

      if (menuToggle) {
        menuToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          if (sidebarCol.classList.contains("drawer-open")) {
            closeProfileDrawer();
          } else {
            openProfileDrawer();
          }
        });
      }

      if (sidebarBackdrop) sidebarBackdrop.addEventListener("click", closeProfileDrawer);
      if (sidebarCloseBtn) sidebarCloseBtn.addEventListener("click", closeProfileDrawer);

      function scrollToWork() {
        const target = document.getElementById("principles-section");
        if (target) target.scrollIntoView({ behavior: "smooth" });
      }

      // 5. Contact & Command Palette Modals
      function openContactModal() {
        const modal = document.getElementById("contactModalBackdrop");
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeContactModal(e) {
        if (e && e.target !== e.currentTarget && !e.target.classList.contains("modal-close-btn")) return;
        const modal = document.getElementById("contactModalBackdrop");
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      function openCmdModal() {
        const modal = document.getElementById("cmdModalBackdrop");
        const input = document.getElementById("cmdSearchInput");
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
        if (input) {
          input.value = "";
          filterCmdList("");
          setTimeout(() => input.focus(), 60);
        }
      }

      function closeCmdModal(e) {
        if (e && e.target !== e.currentTarget && !e.target.classList.contains("cmd-esc-badge")) return;
        const modal = document.getElementById("cmdModalBackdrop");
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      function filterCmdList(query) {
        const items = document.querySelectorAll("#cmdList .cmd-item");
        const q = query.toLowerCase().trim();
        items.forEach((item) => {
          const text = item.innerText.toLowerCase();
          item.style.display = !q || text.includes(q) ? "flex" : "none";
        });
      }

      function setupCmdPalette() {
        const input = document.getElementById("cmdSearchInput");
        if (input) {
          input.addEventListener("input", (e) => filterCmdList(e.target.value));
        }
        document.querySelectorAll("#cmdList .cmd-item").forEach((btn) => {
          btn.addEventListener("click", () => {
            const action = btn.getAttribute("data-action");
            const target = btn.getAttribute("data-target");
            closeCmdModal();
            if (action === "jump" && target) {
              const el = document.querySelector(target);
              if (el) el.scrollIntoView({ behavior: "smooth" });
            } else if (action === "profile") {
              toggleDesktopSidebar();
            } else if (action === "theme") {
              toggleTheme();
            } else if (action === "contact") {
              openContactModal();
            }
          });
        });
      }

      window.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openCmdModal();
        }
        if (e.key === "Escape") {
          closeContactModal();
          closeCmdModal();
        }
      });

      function copyEmail() {
        const email = document.getElementById("emailToCopy").innerText;
        navigator.clipboard.writeText(email).then(() => {
          const text = document.getElementById("copyEmailText");
          text.innerText = "Copied!";
          setTimeout(() => (text.innerText = "Copy"), 2000);
        });
      }

      // 6. Code Lab Tabs & Copy
      function selectTab(event, contentId) {
        document.querySelectorAll(".ide-editor").forEach((tab) => tab.classList.remove("active"));
        document.querySelectorAll(".ide-tab-btn").forEach((btn) => btn.classList.remove("active"));
        document.getElementById(contentId).classList.add("active");
        event.currentTarget.classList.add("active");
      }

      function copyActiveCode() {
        const activeCode = document.querySelector(".ide-editor.active pre code");
        if (!activeCode) return;
        navigator.clipboard.writeText(activeCode.innerText).then(() => {
          const copyText = document.getElementById("copyText");
          const copyIcon = document.getElementById("copyIcon");
          copyText.innerText = "Copied!";
          copyIcon.innerText = "✓";
          setTimeout(() => {
            copyText.innerText = "Copy";
            copyIcon.innerText = "📋";
          }, 2000);
        });
      }

      function scrollSlider(direction) {
        const container = document.getElementById("sliderViewport");
        const scrollAmount = container.clientWidth * 0.8;
        container.scrollBy({ left: scrollAmount * direction, behavior: "smooth" });
      }

      // 7. Interactive Event Mesh Node Flow
      function renderMeshNode(index) {
        currentMeshNode = index;
        const data = meshNodeData[index];
        if (!data) return;

        const nodeCards = document.querySelectorAll("#meshFlowTrack .mesh-node-card");
        nodeCards.forEach((card, idx) => {
          card.classList.toggle("active", idx === index);
        });

        const inspectorCard = document.getElementById("meshInspectorCard");
        if (inspectorCard) {
          inspectorCard.classList.remove("animating-in");
          void inspectorCard.offsetWidth;
          inspectorCard.classList.add("animating-in");
        }

        document.getElementById("meshPhasePill").innerText = data.phase;
        document.getElementById("meshTitle").innerText = data.title;
        document.getElementById("meshProtocol").innerText = data.protocol;
        document.getElementById("meshDesc").innerText = data.desc;
        document.getElementById("meshCleanCore").innerHTML = data.cleanCore;
        document.getElementById("meshPayloadFilename").innerText = data.filename;

        const specList = document.getElementById("meshSpecList");
        if (specList) {
          specList.innerHTML = data.specs.map((spec) => `<li>${spec}</li>`).join("");
        }

        const payloadBlock = document.getElementById("meshPayloadBlock");
        if (payloadBlock) {
          payloadBlock.innerText = data.payload;
        }
      }

      function copyMeshPayload() {
        const activeData = meshNodeData[currentMeshNode];
        if (!activeData) return;
        navigator.clipboard.writeText(activeData.payload).then(() => {
          const text = document.getElementById("meshCopyText");
          const icon = document.getElementById("meshCopyIcon");
          text.innerText = "Copied!";
          icon.innerText = "✓";
          setTimeout(() => {
            text.innerText = "Copy Payload";
            icon.innerText = "📋";
          }, 2000);
        });
      }

      function setupMeshEvents() {
        const nodeCards = document.querySelectorAll("#meshFlowTrack .mesh-node-card");
        nodeCards.forEach((card) => {
          const idx = parseInt(card.getAttribute("data-node"), 10);
          card.addEventListener("click", (e) => {
            e.preventDefault();
            renderMeshNode(idx);
          });
          card.addEventListener("mouseenter", () => {
            renderMeshNode(idx);
          });
        });
        renderMeshNode(0);
      }

      // 8. Modern ABAP 7.5+ Syntax Cookbook
      function selectSnippet(id) {
        if (currentSnippet && currentSnippet.id === id) return;
        const found = abapCookbookData.find((s) => s.id === id);
        if (!found) return;

        currentSnippet = found;

        document.querySelectorAll(".snippet-card-item").forEach((card) => {
          const isActive = card.getAttribute("data-id") === id;
          card.classList.toggle("active", isActive);
          if (isActive && window.innerWidth <= 960) {
            card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          }
        });

        const studio = document.querySelector(".snippet-display-studio");
        if (studio) {
          studio.classList.remove("animating-in");
          void studio.offsetWidth;
          studio.classList.add("animating-in");
        }

        updateStudioView();
      }

      function renderSnippetList(snippets) {
        const listContainer = document.getElementById("snippetCardsList");
        if (!listContainer) return;

        if (snippets.length === 0) {
          listContainer.innerHTML =
            '<div class="no-snippets-msg">No syntax matches found. Try searching "FOR", "VALUE", or "REDUCE".</div>';
          return;
        }

        listContainer.innerHTML = snippets
          .map(
            (item) => `
          <div class="snippet-card-item ${currentSnippet && item.id === currentSnippet.id ? "active" : ""}" data-id="${item.id}">
            <div class="snippet-item-header">
              <span class="snippet-keyword">${item.keyword}</span>
              <span class="snippet-category-tag">${item.categoryName}</span>
            </div>
            <div class="snippet-item-summary">${item.name}</div>
          </div>
        `
          )
          .join("");

        document.querySelectorAll(".snippet-card-item").forEach((card) => {
          const id = card.getAttribute("data-id");
          card.addEventListener("mouseenter", () => selectSnippet(id));
          card.addEventListener("click", (e) => {
            e.preventDefault();
            selectSnippet(id);
          });
        });
      }

      function updateStudioView() {
        if (!currentSnippet) return;

        document.getElementById("studioBadge").innerText = currentSnippet.categoryName.toUpperCase();
        document.getElementById("studioTitle").innerText = `${currentSnippet.keyword} — ${currentSnippet.name}`;
        document.getElementById("studioReduction").innerText = currentSnippet.reduction;
        document.getElementById("studioDescription").innerText = currentSnippet.summary;
        document.getElementById("studioFileName").innerText = currentSnippet.fileName;
        document.getElementById("studioRationale").innerHTML =
          `<strong>Clean Core Benefit:</strong> ${currentSnippet.rationale}`;

        const codeContainer = document.getElementById("studioCodeBlock");
        if (codeContainer) {
          const rawCode = currentMode === "modern" ? currentSnippet.modernCode : currentSnippet.legacyCode;
          codeContainer.innerHTML = highlightAbapSyntax(rawCode);
        }
      }

      function highlightAbapSyntax(code) {
        const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return escaped
          .replace(/(\".*?$)/gm, '<span class="tok-comment">$1</span>')
          .replace(
            /\b(DATA|VALUE|REDUCE|FOR|IN|FILTER|COND|SWITCH|CONV|CORRESPONDING|EXCEPT|MAPPING|INIT|NEXT|WHERE|WHEN|THEN|ELSE|CLEAR|APPEND|LOOP|AT|INTO|ENDLOOP|IF|ELSEIF|ENDIF|CASE|WHEN|ENDCASE|THROW|TYPE|TABLE|OF)\b/g,
            '<span class="tok-kw">$1</span>'
          )
          .replace(/(\'.*?\'|\|.*?\|)/g, '<span class="tok-str">$1</span>');
      }

      function copyCookbookCode() {
        if (!currentSnippet) return;
        const rawCode = currentMode === "modern" ? currentSnippet.modernCode : currentSnippet.legacyCode;
        navigator.clipboard.writeText(rawCode).then(() => {
          const text = document.getElementById("cbCopyText");
          const icon = document.getElementById("cbCopyIcon");
          text.innerText = "Copied!";
          icon.innerText = "✓";
          setTimeout(() => {
            text.innerText = "Copy Code";
            icon.innerText = "📋";
          }, 2000);
        });
      }

      function setupCookbookEvents() {
        const searchInput = document.getElementById("syntaxSearchInput");
        const clearBtn = document.getElementById("clearSearchBtn");
        const categoryPills = document.querySelectorAll(".cat-pill");
        const btnModern = document.getElementById("btnModernMode");
        const btnLegacy = document.getElementById("btnLegacyMode");

        let activeCategory = "all";

        function applyFilter() {
          const query = searchInput.value.toLowerCase().trim();
          clearBtn.classList.toggle("active", query.length > 0);

          const filtered = abapCookbookData.filter((item) => {
            const matchCat = activeCategory === "all" || item.category === activeCategory;
            const matchQuery =
              !query ||
              item.keyword.toLowerCase().includes(query) ||
              item.name.toLowerCase().includes(query) ||
              item.summary.toLowerCase().includes(query);
            return matchCat && matchQuery;
          });

          renderSnippetList(filtered);

          if (filtered.length > 0 && (!currentSnippet || !filtered.some((f) => f.id === currentSnippet.id))) {
            currentSnippet = filtered[0];
            updateStudioView();
          }
        }

        if (searchInput) searchInput.addEventListener("input", applyFilter);
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            applyFilter();
            searchInput.focus();
          });
        }

        categoryPills.forEach((pill) => {
          pill.addEventListener("click", function () {
            categoryPills.forEach((p) => p.classList.remove("active"));
            this.classList.add("active");
            activeCategory = this.getAttribute("data-cat");
            applyFilter();
          });
        });

        if (btnModern) {
          btnModern.addEventListener("click", () => {
            currentMode = "modern";
            btnModern.classList.add("active");
            btnLegacy.classList.remove("active");
            updateStudioView();
          });
        }

        if (btnLegacy) {
          btnLegacy.addEventListener("click", () => {
            currentMode = "legacy";
            btnLegacy.classList.add("active");
            btnModern.classList.remove("active");
            updateStudioView();
          });
        }

        currentSnippet = abapCookbookData[0] || null;
        renderSnippetList(abapCookbookData);
        updateStudioView();
      }

      // 9. Custom Fields & Logic (CFL) Interactive Engine
      function renderCflLifecycle(key) {
        const data = cflLifecycleData[key];
        if (!data) return;

        const cards = document.querySelectorAll("#cflLifecycleGrid .cfl-card");
        cards.forEach((card) => {
          card.classList.toggle("active", card.getAttribute("data-cfl") === key);
        });

        const panel = document.getElementById("cflDetailPanel");
        if (panel) {
          panel.classList.remove("animating-in");
          void panel.offsetWidth;
          panel.classList.add("animating-in");
        }

        document.getElementById("cflPanelBadge").innerText = data.badge;
        document.getElementById("cflPanelTool").innerText = data.tool;
        document.getElementById("cflPanelTitle").innerText = data.title;
        document.getElementById("cflPanelDesc").innerText = data.desc;
        document.getElementById("cflGuardrailNote").innerHTML = data.guardrail;

        const listEl = document.getElementById("cflInstructionsList");
        if (listEl) {
          listEl.innerHTML = data.steps.map((step) => `<li>${step}</li>`).join("");
        }
      }

      function setupCflLifecycleEvents() {
        const cards = document.querySelectorAll("#cflLifecycleGrid .cfl-card");
        cards.forEach((card) => {
          const key = card.getAttribute("data-cfl");
          card.addEventListener("click", (e) => {
            e.preventDefault();
            renderCflLifecycle(key);
          });
          card.addEventListener("mouseenter", () => {
            renderCflLifecycle(key);
          });
        });
        renderCflLifecycle("enable");
      }

      // 10. Coding Block 10-Step Runbook Stepper
      function renderRunbookStep(index) {
        if (index < 0 || index >= codingBlockSteps.length) return;
        currentRunbookStep = index;
        const step = codingBlockSteps[index];

        const navButtons = document.querySelectorAll("#runbookNavRail .step-nav-btn");
        navButtons.forEach((btn, idx) => {
          btn.classList.toggle("active", idx === index);
        });

        const displayCard = document.getElementById("runbookDisplayCard");
        if (displayCard) {
          displayCard.classList.remove("animating-in");
          void displayCard.offsetWidth;
          displayCard.classList.add("animating-in");
        }

        document.getElementById("stepCounter").innerText = step.counter;
        document.getElementById("stepPhaseTag").innerText = step.phase;
        document.getElementById("stepTitle").innerText = step.title;
        document.getElementById("stepDescription").innerText = step.desc;
        document.getElementById("stepTCode").innerText = step.tcode;
        document.getElementById("stepCommand").innerText = step.command;
        document.getElementById("stepAlert").innerHTML = `<strong>Rule:</strong> ${step.alert}`;

        const pct = Math.round(((index + 1) / codingBlockSteps.length) * 100);
        const fillEl = document.getElementById("runbookProgressFill");
        const textEl = document.getElementById("runbookProgressText");
        if (fillEl) fillEl.style.width = pct + "%";
        if (textEl) textEl.innerText = `Step ${index + 1} of ${codingBlockSteps.length} (${pct}%)`;

        const prevBtn = document.getElementById("prevStepBtn");
        const nextBtn = document.getElementById("nextStepBtn");
        if (prevBtn) prevBtn.disabled = index === 0;
        if (nextBtn) nextBtn.disabled = index === codingBlockSteps.length - 1;
      }

      function navigateRunbook(direction) {
        const target = currentRunbookStep + direction;
        if (target >= 0 && target < codingBlockSteps.length) {
          renderRunbookStep(target);
          const activeNavBtn = document.querySelectorAll("#runbookNavRail .step-nav-btn")[target];
          if (activeNavBtn && window.innerWidth <= 960) {
            activeNavBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          }
        }
      }

      function setupRunbookEvents() {
        const navButtons = document.querySelectorAll("#runbookNavRail .step-nav-btn");
        navButtons.forEach((btn) => {
          const idx = parseInt(btn.getAttribute("data-step"), 10);
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            renderRunbookStep(idx);
          });
          btn.addEventListener("mouseenter", () => {
            renderRunbookStep(idx);
          });
        });
        renderRunbookStep(0);
      }

      // 11. Clean Core Matrix Slider
      function renderMatrixScenario(index, shouldScroll = true) {
        currentMatrixIdx = index;
        const data = cleanCoreData[index];
        if (!data) return;

        const buttons = document.querySelectorAll("#cleanCoreSection .scenario-btn");
        buttons.forEach((btn, idx) => {
          btn.classList.toggle("active", idx === index);
        });

        const dots = document.querySelectorAll("#cleanCoreSection .matrix-dot");
        dots.forEach((dot, idx) => {
          dot.classList.toggle("active", idx === index);
        });

        if (shouldScroll) {
          const viewport = document.getElementById("matrixSliderViewport");
          const activeBtn = buttons[index];
          if (viewport && activeBtn) {
            const scrollPos = activeBtn.offsetLeft - viewport.clientWidth / 2 + activeBtn.clientWidth / 2;
            viewport.scrollTo({ left: Math.max(0, scrollPos), behavior: "smooth" });
          }
        }

        const card = document.getElementById("blueprintCard");
        if (card) {
          card.classList.remove("animating-in");
          void card.offsetWidth;
          card.classList.add("animating-in");
        }

        document.getElementById("bpTier").innerText = data.tier;
        document.getElementById("bpContract").innerText = data.contract;
        document.getElementById("bpTitle").innerText = data.title;
        document.getElementById("bpDesc").innerText = data.desc;

        document.getElementById("bpPipeline").innerHTML = data.pipeline
          .map((step, idx) => {
            const arrow = idx < data.pipeline.length - 1 ? '<div class="pipe-arrow">&rarr;</div>' : "";
            return `<div class="pipe-step ${step.type}">${step.name}</div>${arrow}`;
          })
          .join("");

        document.getElementById("bpGuardrails").innerHTML = data.guardrails
          .map((item) => `<div class="guardrail-item"><span class="check-icon">✓</span><span>${item}</span></div>`)
          .join("");

        document.getElementById("bpTags").innerHTML = data.tags.map((t) => `<span class="pill">${t}</span>`).join("");
      }

      function setupMatrixEvents() {
        const buttons = document.querySelectorAll("#cleanCoreSection .scenario-btn");
        const dots = document.querySelectorAll("#cleanCoreSection .matrix-dot");
        const prevBtn = document.getElementById("matrixPrevBtn");
        const nextBtn = document.getElementById("matrixNextBtn");

        buttons.forEach((btn) => {
          const idx = parseInt(btn.getAttribute("data-index"), 10);
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            renderMatrixScenario(idx, true);
          });
          btn.addEventListener("mouseenter", () => {
            renderMatrixScenario(idx, false);
          });
        });

        dots.forEach((dot) => {
          const idx = parseInt(dot.getAttribute("data-index"), 10);
          dot.addEventListener("click", () => renderMatrixScenario(idx, true));
          dot.addEventListener("mouseenter", () => renderMatrixScenario(idx, false));
        });

        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            const prev = (currentMatrixIdx - 1 + cleanCoreData.length) % cleanCoreData.length;
            renderMatrixScenario(prev, true);
          });
        }

        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            const next = (currentMatrixIdx + 1) % cleanCoreData.length;
            renderMatrixScenario(next, true);
          });
        }
        renderMatrixScenario(0, false);
      }

      // 12. Connected Experience Accordion (+ / - Toggle)
      function setupExperienceAccordion() {
        const toggleButtons = document.querySelectorAll(".exp-toggle-btn");
        toggleButtons.forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const card = btn.closest(".timeline-card");
            const wrapper = card.querySelector(".exp-collapse-wrapper");
            const isCurrentlyOpen = wrapper.classList.contains("is-open");

            wrapper.classList.toggle("is-open", !isCurrentlyOpen);
            btn.classList.toggle("is-open", !isCurrentlyOpen);
            btn.setAttribute("aria-expanded", !isCurrentlyOpen);
          });
        });
      }

      // 13. Fetch External JSON & Initialize All Interactive Modules
      async function loadPortfolioDataAndInit() {
        setupCmdPalette();
        setupExperienceAccordion();

        try {
          const response = await fetch("./portfolio-data.json");
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          const data = await response.json();

          meshNodeData = data.meshNodeData || [];
          abapCookbookData = data.abapCookbookData || [];
          cflLifecycleData = data.cflLifecycleData || {};
          codingBlockSteps = data.codingBlockSteps || [];
          cleanCoreData = data.cleanCoreData || [];

          setupMeshEvents();
          setupCookbookEvents();
          setupCflLifecycleEvents();
          setupRunbookEvents();
          setupMatrixEvents();
        } catch (err) {
          console.error("Failed to load portfolio-data.json:", err);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadPortfolioDataAndInit);
      } else {
        loadPortfolioDataAndInit();
      }
    </script>
